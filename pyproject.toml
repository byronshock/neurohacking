[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walnutbutter"
version = "0.1.0"
description = "Fire-once threshold neurons spread on the plane as walnut butter, wired by reach, taught by global reinforcement while they run."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
viz = ["pygame>=2.5"]
arrays = ["numpy>=2", "scipy>=1.12"]
dev = ["pytest>=8", "pygame>=2.5", "numpy>=2", "scipy>=1.12"]

# This makes `walnutbutter` a real command after `pip install -e .`
[project.scripts]
walnutbutter = "walnutbutter.cli:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
