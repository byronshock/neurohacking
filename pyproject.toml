[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurohacking"
version = "0.1.0"
description = "Signal propagation through a hexagonal grid of neurons."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

# This makes `neurohacking` a real command after `pip install -e .`
[project.scripts]
neurohacking = "neurohacking.cli:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
